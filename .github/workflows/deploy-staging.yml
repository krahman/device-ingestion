name: Deploy Kubernetes staging

on:
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: Confirm AWS ECR/EKS staging deployment (may incur AWS charges)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:

  validate-manual:
    if: inputs.confirm_staging_deploy
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: validate-manual
    if: inputs.confirm_staging_deploy && needs.validate-manual.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: kubernetes-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'device-ingestion-staging' }}
      ECR_REPOSITORY: device-ingestion/staging
      DATABASE_HOST: ${{ vars.DATABASE_HOST }}
      DATABASE_SECRET_ARN: ${{ vars.DATABASE_SECRET_ARN }}
      KAFKA_BROKERS: ${{ vars.KAFKA_BROKERS }}
      MSK_SCRAM_SECRET_ARN: ${{ vars.MSK_SCRAM_SECRET_ARN }}
      OCPP_STATIONS_SECRET_ARN: ${{ vars.OCPP_STATIONS_SECRET_ARN }}
      OCPI_PARTNERS_SECRET_ARN: ${{ vars.OCPI_PARTNERS_SECRET_ARN }}
      APPLICATION_ROLE_ARN: ${{ vars.APPLICATION_ROLE_ARN }}
      CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      CPO_COUNTRY_CODE: ${{ vars.CPO_COUNTRY_CODE }}
      CPO_PARTY_ID: ${{ vars.CPO_PARTY_ID }}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${{ vars.KAFKA_TOPIC_REPLICATION_FACTOR || '2' }}
      OCPP_ENABLED: ${{ vars.OCPP_ENABLED || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.DEPLOY_SHA }}
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        id: ecr
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4
      - name: Build and publish immutable image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Image $IMAGE_TAG already exists; reusing the immutable image."
          else
            docker build --pull --platform linux/amd64 \
              --build-arg OCI_VERSION="$IMAGE_TAG" \
              --build-arg OCI_REVISION="$IMAGE_TAG" \
              -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
            docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          fi
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Configure Kubernetes credentials
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Render staging Helm values
        env:
          IMAGE_REPOSITORY: ${{ steps.ecr.outputs.registry }}/device-ingestion/staging
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
        run: python3 scripts/render-kubernetes-values.py > "$RUNNER_TEMP/staging-values.yaml"
      - name: Apply workload configuration before setup Jobs
        env:
          VALUES_FILE: ${{ runner.temp }}/staging-values.yaml
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail
          for manifest in serviceaccount.yaml configmap.yaml secretproviderclass.yaml; do
            helm template device-ingestion deploy/kubernetes/device-ingestion \
              --namespace "$K8S_NAMESPACE" \
              --values "$VALUES_FILE" \
              --set-string image.tag="$IMAGE_TAG" \
              --show-only "templates/$manifest" | kubectl apply -f -
          done
      - name: Initialize Kafka topics
        env:
          VALUES_FILE: ${{ runner.temp }}/staging-values.yaml
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          JOB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          job="device-ingestion-kafka-init-${JOB_RUN_ID}"
          helm template device-ingestion deploy/kubernetes/device-ingestion \
            --namespace "$K8S_NAMESPACE" --values "$VALUES_FILE" \
            --set-string image.tag="$IMAGE_TAG" --set jobs.enabled=true \
            --set-string jobs.runId="$JOB_RUN_ID" \
            --show-only templates/job-kafka-init.yaml | kubectl apply -f -
          if ! kubectl wait --namespace "$K8S_NAMESPACE" --for=condition=complete "job/$job" --timeout=4m; then
            kubectl logs --namespace "$K8S_NAMESPACE" "job/$job" --all-containers=true || true
            exit 1
          fi
      - name: Apply database migrations
        env:
          VALUES_FILE: ${{ runner.temp }}/staging-values.yaml
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          JOB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          job="device-ingestion-migrate-${JOB_RUN_ID}"
          helm template device-ingestion deploy/kubernetes/device-ingestion \
            --namespace "$K8S_NAMESPACE" --values "$VALUES_FILE" \
            --set-string image.tag="$IMAGE_TAG" --set jobs.enabled=true \
            --set-string jobs.runId="$JOB_RUN_ID" \
            --show-only templates/job-migrate.yaml | kubectl apply -f -
          if ! kubectl wait --namespace "$K8S_NAMESPACE" --for=condition=complete "job/$job" --timeout=6m; then
            kubectl logs --namespace "$K8S_NAMESPACE" "job/$job" --all-containers=true || true
            exit 1
          fi
      - name: Deploy Kubernetes release
        id: deploy_release
        env:
          VALUES_FILE: ${{ runner.temp }}/staging-values.yaml
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail
          helm upgrade --install device-ingestion deploy/kubernetes/device-ingestion \
            --namespace "$K8S_NAMESPACE" --values "$VALUES_FILE" \
            --set-string image.tag="$IMAGE_TAG" --wait --timeout 8m
          kubectl rollout status --namespace "$K8S_NAMESPACE" deployment/device-ingestion --timeout=8m
      - name: Diagnose application rollout failure
        if: failure() && steps.deploy_release.outcome == 'failure'
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'device-ingestion-staging' }}
        run: |
          set +e
          kubectl get deployment device-ingestion --namespace "$K8S_NAMESPACE" -o wide
          kubectl describe deployment device-ingestion --namespace "$K8S_NAMESPACE" | tail -n 100
          pods=$(kubectl get pods --namespace "$K8S_NAMESPACE" \
            -l app.kubernetes.io/instance=device-ingestion \
            --sort-by=.metadata.creationTimestamp -o name | tail -n 3)
          for pod in $pods; do
            kubectl describe --namespace "$K8S_NAMESPACE" "$pod" | tail -n 100
            kubectl logs --namespace "$K8S_NAMESPACE" "$pod" --all-containers=true --tail=100
          done
          kubectl get events --namespace "$K8S_NAMESPACE" \
            --sort-by=.lastTimestamp | tail -n 50
      - name: Run protocol and persistence smoke checks
        id: smoke_checks
        env:
          VALUES_FILE: ${{ runner.temp }}/staging-values.yaml
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          JOB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          job="device-ingestion-smoke-${JOB_RUN_ID}"
          helm template device-ingestion deploy/kubernetes/device-ingestion \
            --namespace "$K8S_NAMESPACE" --values "$VALUES_FILE" \
            --set-string image.tag="$IMAGE_TAG" --set jobs.enabled=true \
            --set-string jobs.runId="$JOB_RUN_ID" \
            --show-only templates/job-smoke.yaml | kubectl apply -f -
          if ! kubectl wait --namespace "$K8S_NAMESPACE" --for=condition=complete "job/$job" --timeout=4m; then
            kubectl logs --namespace "$K8S_NAMESPACE" "job/$job" --all-containers=true --tail=100 || true
            exit 1
          fi
          kubectl logs --namespace "$K8S_NAMESPACE" "job/$job" --all-containers=true --tail=100
      - name: Diagnose smoke Job failure
        if: failure() && steps.smoke_checks.outcome == 'failure'
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'device-ingestion-staging' }}
          JOB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +e
          job="device-ingestion-smoke-${JOB_RUN_ID}"
          kubectl get job "$job" --namespace "$K8S_NAMESPACE" -o wide
          kubectl describe job "$job" --namespace "$K8S_NAMESPACE" | tail -n 100
          pods=$(kubectl get pods --namespace "$K8S_NAMESPACE" \
            -l "job-name=$job" \
            --sort-by=.metadata.creationTimestamp -o name | tail -n 3)
          for pod in $pods; do
            kubectl describe --namespace "$K8S_NAMESPACE" "$pod" | tail -n 100
            kubectl logs --namespace "$K8S_NAMESPACE" "$pod" --all-containers=true --tail=100
          done
          kubectl get events --namespace "$K8S_NAMESPACE" \
            --sort-by=.lastTimestamp | tail -n 50
