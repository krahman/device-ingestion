apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-ingestion-postgres
  namespace: device-ingestion-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: device-ingestion-postgres
  template:
    metadata:
      labels:
        app: device-ingestion-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: device_ingestion
            - name: POSTGRES_PASSWORD
              value: device_ingestion
            - name: POSTGRES_DB
              value: device_ingestion
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U device_ingestion -d device_ingestion"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: device-ingestion-postgres
  namespace: device-ingestion-staging
spec:
  selector:
    app: device-ingestion-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-ingestion-kafka
  namespace: device-ingestion-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: device-ingestion-kafka
  template:
    metadata:
      labels:
        app: device-ingestion-kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx256m
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://device-ingestion-kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
          ports:
            - containerPort: 9092
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: device-ingestion-kafka
  namespace: device-ingestion-staging
spec:
  selector:
    app: device-ingestion-kafka
  ports:
    - port: 9092
      targetPort: 9092
