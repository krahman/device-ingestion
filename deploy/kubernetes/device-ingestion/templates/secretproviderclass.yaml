{{- if .Values.awsSecrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "device-ingestion.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.awsRegion | quote }}
    objects: |
      - objectName: "{{ .Values.kafka.secretArn }}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "kafka-username"
          - path: "password"
            objectAlias: "kafka-password"
      - objectName: "{{ .Values.database.secretArn }}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "database-username"
          - path: "password"
            objectAlias: "database-password"
      - objectName: "{{ .Values.secrets.ocppStationsArn }}"
        objectType: "secretsmanager"
        objectAlias: "ocpp-stations"
      - objectName: "{{ .Values.secrets.ocpiPartnersArn }}"
        objectType: "secretsmanager"
        objectAlias: "ocpi-partners"
  secretObjects:
    - secretName: {{ .Release.Name }}-credentials
      type: Opaque
      data:
        - objectName: kafka-username
          key: KAFKA_SASL_USERNAME
        - objectName: kafka-password
          key: KAFKA_SASL_PASSWORD
        - objectName: database-username
          key: DATABASE_USER
        - objectName: database-password
          key: DATABASE_PASSWORD
        - objectName: ocpp-stations
          key: OCPP_STATIONS
        - objectName: ocpi-partners
          key: OCPI_EMSP_PARTNERS
{{- end }}
